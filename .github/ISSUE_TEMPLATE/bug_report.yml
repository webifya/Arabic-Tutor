name: Bug report
description: Report a reproducible problem without including secrets or learner data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private learner data, or recordings.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, cPanel/Passenger, VPS/Docker, Vercel, Other]
    validations:
      required: true
